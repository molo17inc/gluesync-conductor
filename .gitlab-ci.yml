stages:
  - build
  - merge_request
  - quality
  - deploy
  - notify

image: node:20.10.0

default:
  tags:
    - gs-runners-hq

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 20
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fastest'
  CACHE_COMPRESSION_LEVEL: 'fastest'
  TRANSFER_METER_FREQUENCY: '1s'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  DOCKER_TLS_CERTDIR: ''
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/gluesync-conductor
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

build_mr:
  stage: merge_request
  script:
    - export ENV="dev"
    - echo "Building..."
    - corepack enable
    - yarn --version 
    - yarn install
    - yarn do
  only:
    - merge_requests

build:
  stage: build
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi
    
    - echo "Building..."
    - corepack enable
    - yarn --version 
    - yarn install
    - yarn do
    
    - echo "Lint check..."
  artifacts:
    paths:
      - packages/docker-mate/build
      - packages/gluesync-sdk/dist
      - packages/gluesync-corehub-sdk/dist
    expire_in: 3 days
    when: on_success
  only:
    - develop
    - staging
    - main
    - tags

quality:
  stage: quality
  needs:
    - build
  script:
    - echo "Running quality checks..."
    # Add your quality checks here
  only:
    - develop
    - staging
    - main

deploy:
  stage: deploy
  image: docker:20.10.0
  services:
    - name: docker:dind
  needs:
    - build
  script:
   - |
     if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
     if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
     if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

     apk add --no-cache bash
     echo "APP_NAME=$APP_NAME"
     docker login -u $CI_REGISTRY_USER -p "$CI_REGISTRY_PASSWORD"

     DEFAULT_NAME="$DOCKER_REGISTRY/$APP_NAME"
     echo "DEFAULT_NAME=$DEFAULT_NAME"

     if [ -n "$CI_COMMIT_TAG" ]; then
      TAGPART=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')
      VERSION_TAG="${DOCKER_REGISTRY}/${APP_NAME}:${TAGPART}"
     else
      VERSION_TAG="${DOCKER_REGISTRY}/${APP_NAME}:${ENV}"
     fi

     echo "VERSION_TAG=$VERSION_TAG"

     cd packages/docker-mate
     docker build -t "$VERSION_TAG" .
     docker push "$VERSION_TAG"
  only:
    - develop
    - staging
    - main
    - tags



notify:
  stage: notify
  needs:
    - deploy
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

    - echo "Notification sent for ${ENV} environment"
    # Add your notification logic here
  only:
    - develop
    - staging
    - main
