stages:
  - build
  - quality
  - deploy

default:
  tags:
    - hq-linux-docker

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 20
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fastest'
  CACHE_COMPRESSION_LEVEL: 'fastest'
  TRANSFER_METER_FREQUENCY: '1s'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  DOCKER_TLS_CERTDIR: ''
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/gluesync-conductor
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

build_artifacts:
  stage: build
  image: node:22.13.1-alpine
  script:
    - echo "Building artifacts..."
    - corepack enable
    - node --version
    - yarn --version

    - echo "Installing dependencies..."
    - yarn install --immutable --immutable-cache

    - echo "Building..."
    - yarn build
  artifacts:
    paths:
      - packages/**/build
      - packages/**/dist
      - packages/**/lib
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

quality:
  stage: quality
  image: node:22.13.1-alpine
  needs:
    - job: build_artifacts
      artifacts: true
  script:
    - echo "Running quality checks..."
    - corepack enable
    - node --version
    - yarn --version

    - echo "Installing dependencies..."
    - yarn install --immutable --immutable-cache

    - echo "Running linting..."
    - yarn lint
    
    - echo "Running type-check..."
    - yarn type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

docker_images:
  stage: deploy
  image: docker:28.3.3
  services:
    - name: docker:dind
  needs:
    - job: build_artifacts
      artifacts: true
    - job: quality
  script:
    - echo "Running build and push docker images..."
    - apk add --no-cache bash
    - docker version

    # Login to Docker hub registry as default
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    
    # Enable Buildx
    - docker buildx version

    # Register QEMU for multiarch
    - docker run --rm --privileged tonistiigi/binfmt --install all

    # Create a new builder using docker-container driver
    - docker buildx create --name multiarch-builder --driver docker-container --use
    - docker buildx inspect --bootstrap

    # Decide build strategy
    - |
      set -euo pipefail
      set -x  # Debug: print all commands before execution

      BRANCH="${CI_COMMIT_BRANCH:-undefined}"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
          TAG_PART=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')
      else
          TAG_PART=""
      fi

      # Create VERSION file
      echo "${TAG_PART}" > VERSION
      echo "VERSION file created with content: $(cat VERSION)"

      echo "Branch=\"$BRANCH\", Tag=\"$TAG_PART\""

      if [[ "$BRANCH" == "develop" && -z "$TAG_PART" ]]; then
          echo "[INFO] Develop branch detected → multi-arch build with tag 'develop'"
          /bin/bash ./packages/scripts/docker_images.sh packages/gluesync-conductor gluesync-conductor "develop"

      elif [[ -n "$TAG_PART" ]]; then
          echo "[INFO] Tag detected: \"$TAG_PART\""

          if [[ "$CI_COMMIT_TAG" == release-* ]]; then
              echo "[INFO] Release tag detected → using TAG_PART=\"$TAG_PART\""
              /bin/bash ./packages/scripts/docker_images.sh packages/gluesync-conductor gluesync-conductor "$TAG_PART,latest"

          elif [[ "$CI_COMMIT_TAG" == beta-* ]]; then
              echo "[INFO] Regular tag detected → using TAG_PART=\"$TAG_PART\""
              /bin/bash ./packages/scripts/docker_images.sh packages/gluesync-conductor gluesync-conductor "$TAG_PART"

          elif [[ "$CI_COMMIT_TAG" == alpha-* ]]; then
              echo "[INFO] Regular tag detected → using TAG_PART=\"$TAG_PART\" and CI_COMMIT_SHORT_SHA=\"$CI_COMMIT_SHORT_SHA\""
              /bin/bash ./packages/scripts/docker_images.sh packages/gluesync-conductor gluesync-conductor "$TAG_PART.$CI_COMMIT_SHORT_SHA"

          else
              echo "[ERROR] Unknown tag format: \"$TAG_PART\""
              exit 1
          fi

      else
          echo "[ERROR] Unknown branch/tag combination: branch=\"$BRANCH\", tag=\"$TAG_PART\""
          exit 1
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'

update_budibase_version:
  stage: deploy
  image: bash:5.3.9
  needs:
    - job: docker_images
  script:
    - apk add --no-cache curl jq
    - |
      set -euo pipefail
      
      # Determine RELEASE_TYPE and MODULE_VERSION based on tag/branch
      
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        MODULE_VERSION=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')

        if [[ "$CI_COMMIT_TAG" == alpha-* ]]; then
          MODULE_VERSION="$MODULE_VERSION.$CI_COMMIT_SHORT_SHA"
          RELEASE_TYPE="ALPHA"
        elif [[ "$CI_COMMIT_TAG" == beta-* ]]; then
          RELEASE_TYPE="BETA"
        elif [[ "$CI_COMMIT_TAG" == release-* ]]; then
          RELEASE_TYPE="GA"
        else
          echo "[ERROR] Unknown tag format"
          exit 1
        fi
      else
        echo "[ERROR] Not a tracked tag"
        exit 1
      fi
      
      BUILD_TAG="conductor"
      
      echo "[INFO] Updating Budibase version: BUILD_TAG=$BUILD_TAG, MODULE_VERSION=$MODULE_VERSION, RELEASE_TYPE=$RELEASE_TYPE"
      
      # Search for existing row
      SEARCH_PAYLOAD="{
        \"query\": {
          \"equal\": {
            \"internalName\": \"$BUILD_TAG\"
          }
        },
        \"paginate\": false,
        \"limit\": 1000
      }"

      SEARCH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$SEARCH_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/search")

      SEARCH_BODY=$(echo "$SEARCH_RESPONSE" | sed -e '$d')
      SEARCH_STATUS=$(echo "$SEARCH_RESPONSE" | tail -n 1)

      if [ "$SEARCH_STATUS" -ne 200 ]; then
        echo "Failed to search for row. HTTP Status: $SEARCH_STATUS"
        echo "Response: $SEARCH_BODY"
        echo "Search Payload: $SEARCH_PAYLOAD"
        exit 1
      fi

      ROW_ID=$(echo "$SEARCH_BODY" | jq -r '.data[0]._id // empty')

      if [ -z "$ROW_ID" ]; then
        echo "No matching row found for INTERNAL_NAME: $BUILD_TAG"
        exit 1
      fi

      # Prepare update payload based on release type
      if [ "$RELEASE_TYPE" = "ALPHA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionAlpha\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "BETA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionBeta\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "GA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionGA\": \"$MODULE_VERSION\"
        }"
      else
        echo "Unrecognized value: $RELEASE_TYPE"
        exit 1
      fi

      # Update the row
      UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$UPDATE_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/$ROW_ID")

      UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | sed -e '$d')
      UPDATE_STATUS=$(echo "$UPDATE_RESPONSE" | tail -n 1)

      echo "Budibase API update response code: $UPDATE_STATUS"
      echo "Budibase API update response: $UPDATE_BODY"

      if [ "$UPDATE_STATUS" -ge 200 ] && [ "$UPDATE_STATUS" -lt 300 ]; then
          echo "Successfully updated version on budibase"
      else
          echo "Failed to update version on budibase. HTTP Status: $UPDATE_STATUS"
          exit 1
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'

build_windows_nanoserver_artifacts:
  stage: deploy
  variables:
    APP_NAME: 'gluesync-conductor'
    WINDOWS_VERSION: 'nanoserver'
  parallel:
    matrix:
      - WINDOWS_TAG: "ltsc2019"
        WINDOWS_RUNNER_VERSION: "2019"
      - WINDOWS_TAG: "ltsc2022"
        WINDOWS_RUNNER_VERSION: "2022"
      # - WINDOWS_TAG: "ltsc2025"
      #   WINDOWS_RUNNER_VERSION: "2025"
  tags:
    - 'hq-windows-shell-${WINDOWS_RUNNER_VERSION}'
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - pwsh .\ci\docker-build-win.ps1 -AppName "$APP_NAME" -WindowsTag "$WINDOWS_TAG" -WindowsVersion "$WINDOWS_VERSION"
