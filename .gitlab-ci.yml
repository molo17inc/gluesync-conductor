stages:
  - quality
  - docker_images

default:
  tags:
    - gs-runners-hq

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 20
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fastest'
  CACHE_COMPRESSION_LEVEL: 'fastest'
  TRANSFER_METER_FREQUENCY: '1s'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  DOCKER_TLS_CERTDIR: ''
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/gluesync-conductor
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

quality:
  stage: quality
  image: node:22.13.1-alpine
  script:
    - echo "Running quality checks..."
    - corepack enable
    - node --version
    - yarn --version

    - echo "Installing dependencies..."
    - yarn install --immutable --immutable-cache

    - echo "Running linting..."
    - yarn lint

    - echo "Building..."
    - yarn build
    
    - echo "Running type-check..."
    - yarn type-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

build_push_docker_images:
  stage: docker_images
  image: docker:28.3.3
  services:
    - name: docker:dind
  needs:
    - quality
  script:
    - echo "Running build and push docker images..."
    - apk add --no-cache bash
    - docker version

    # Enable Buildx
    - docker buildx version

    # Register QEMU for multiarch
    - docker run --rm --privileged tonistiigi/binfmt --install all

    # Create a new builder using docker-container driver
    - docker buildx create --name multiarch-builder --driver docker-container --use
    - docker buildx inspect --bootstrap

    - echo "Docker ws builder..."
    - docker buildx build --pull=false --platform linux/amd64 --progress=plain --no-cache -t repo-ws-builder --load .

    - echo "Docker push images..."
    - /bin/bash ./packages/scripts/docker_images.sh packages/docker-mate gluesync-conductor:dev-dk

