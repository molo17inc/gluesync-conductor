stages:
  - build
  - merge_request
  - quality
  - deploy
  - notify

image: node:20.10.0

default:
  tags:
    - gs-runners-hq

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 20
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fastest'
  CACHE_COMPRESSION_LEVEL: 'fastest'
  TRANSFER_METER_FREQUENCY: '1s'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  DOCKER_TLS_CERTDIR: ''
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/gluesync-conductor
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

build_mr:
  stage: merge_request
  script:
    - export ENV="dev"
    - echo "Building..."
    - corepack enable
    - yarn --version 
    - yarn install
    - yarn do
  only:
    - merge_requests

build:
  stage: build
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi
    
    - echo "Building..."
    - corepack enable
    - yarn --version 
    - yarn install
    - yarn do
    
    - echo "Lint check..."
  artifacts:
    paths:
      - packages/docker-mate/build
      - packages/gluesync-sdk/dist
      - packages/gluesync-corehub-sdk/dist
    expire_in: 3 days
    when: on_success
  only:
    - develop
    - staging
    - main
    - merge_requests

quality:
  stage: quality
  needs:
    - build
  script:
    - echo "Running quality checks..."
    # Add your quality checks here
  only:
    - develop
    - staging
    - main
    - merge_requests

deploy:
  stage: deploy
  image: docker:20.10.0
  services:
    - name: docker:dind
  needs:
    - build
  script:
    - echo "Deploying..."
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

    - apk add --no-cache bash
    - docker login -u $CI_REGISTRY_USER -p "$CI_REGISTRY_PASSWORD"
    - export DEFAULT_NAME="$DOCKER_REGISTRY/gluesync-conductor"
    - cd packages/docker-mate
    - docker build -t $DEFAULT_NAME .
    - docker push $DEFAULT_NAME


    # - /bin/sh packages/scripts/docker-build.sh packages/docker-mate docker-mate-dev


  only:
    - develop
    - staging
    - main
    - tags
    - merge_requests


notify:
  stage: notify
  needs:
    - deploy
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

    - echo "Notification sent for ${ENV} environment"
    # Add your notification logic here
  only:
    - develop
    - staging
    - main
