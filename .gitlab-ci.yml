stages:
  - build
  - merge_request
  - quality
  - deploy
  - notify

image: node:20.10.0

default:
  tags:
    - docker

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 20
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: 'fastest'
  CACHE_COMPRESSION_LEVEL: 'fastest'
  TRANSFER_METER_FREQUENCY: '1s'
  YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
  DOCKER_TLS_CERTDIR: ''
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/gluesync-conductor
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

build_mr:
  stage: merge_request
  script:
    - export ENV="dev"
    - echo "Building..."
    - yarn install --frozen-lockfile
    - yarn workspaces run build
    - echo "Lint check..."
    - yarn lint
    - echo "Running tests..."
    - yarn workspaces run test
  only:
    - merge_requests

build:
  stage: build
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi
    
    - echo "Building..."
    - yarn install --frozen-lockfile
    - yarn workspaces run build
    
    - echo "Lint check..."
    - yarn lint
    
    - echo "Running tests..."
    - yarn workspaces run test
  artifacts:
    paths:
      - packages/docker-mate/dist
      - packages/gluesync-sdk/dist
      - packages/gluesync-corehub-sdk/dist
    expire_in: 3 days
    when: on_success
  only:
    - develop
    - staging
    - main

quality:
  stage: quality
  needs:
    - build
  script:
    - echo "Running quality checks..."
    # Add your quality checks here
  only:
    - develop
    - staging
    - main

deploy:
  stage: deploy
  image: docker:20.10.0
  services:
    - name: docker:dind
  needs:
    - build
  script:
    - echo "Deploying..."
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

    - apk add --no-cache bash
    - echo "registry user" $CI_REGISTRY_USER
    - echo "registry password" $CI_REGISTRY_PASSWORD
    - echo "ci registry" $CI_REGISTRY
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - 
      |
      MODULE_NAME=${CI_COMMIT_TAG#tag-}  # Removes everything before "tag-"
      MODULE_NAME=${MODULE_NAME%-v*}  # Removes everything after the last "-"

      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"
    
    # For tags, also build multi-platform images
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        # Extract version from tag
        TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`
        
        # Install QEMU for multi-architecture builds
        docker run --privileged --rm tonistiigi/binfmt --install all
        # Create and use a new builder instance
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        
        # Build and push multi-platform images
        docker buildx build --platform linux/amd64,linux/arm64 \
          --tag $DEFAULT_NAME:latest \
          --tag "$ADDITIONAL_TAG" \
          --push -f packages/docker-mate/Dockerfile .
      fi
  only:
    - develop
    - staging
    - main
    - tags

notify:
  stage: notify
  needs:
    - deploy
  script:
    - if [[ $CI_COMMIT_BRANCH == "develop" ]] || [[ $CI_COMMIT_BRANCH == "" ]]; then export ENV="dev"; fi
    - if [[ $CI_COMMIT_BRANCH == "staging" ]]; then export ENV="test"; fi
    - if [[ $CI_COMMIT_BRANCH == "main" ]]; then export ENV="prod"; fi

    - echo "Notification sent for ${ENV} environment"
    # Add your notification logic here
  only:
    - develop
    - staging
    - main