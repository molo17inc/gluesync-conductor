stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/container-mate
  CONTAINER_MATE_IMAGE: ${DOCKER_REGISTRY}:${CI_COMMIT_REF_SLUG}

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    # Login to GitLab registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Build the Docker image
    - docker build -t $CONTAINER_MATE_IMAGE .
    # Push the Docker image to GitLab registry
    - docker push $CONTAINER_MATE_IMAGE
  only:
    - main
    - develop
    - tags

test:
  stage: test
  image: node:18-alpine
  before_script:
    - yarn install --frozen-lockfile
  script:
    - yarn workspaces run build
    - yarn workspaces run test
  only:
    - main
    - develop
    - merge_requests

integration_test:
  stage: test
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    # Test environment variables
    GLUESYNC_LICENSE_FILE: /opt/gluesync/data/gs-license.dat
    GLUESYNC_MODULE_TAG: container-mate-test
    GLUESYNC_SECURITY_CONFIG: /opt/gluesync/data/security-config.json
  script:
    # Create test directories
    - mkdir -p /opt/gluesync/data
    # Use dummy license and security config for testing
    - echo "{}" > /opt/gluesync/data/security-config.json
    - echo "dummy-license" > /opt/gluesync/data/gs-license.dat
    # Pull the built image
    - docker pull $CONTAINER_MATE_IMAGE
    # Run the container with test configuration
    - |
      docker run -d --name container-mate-test \
        -v /opt/gluesync/data:/opt/gluesync/data \
        -e GLUESYNC_LICENSE_FILE=/opt/gluesync/data/gs-license.dat \
        -e GLUESYNC_MODULE_TAG=container-mate-test \
        -e GLUESYNC_SECURITY_CONFIG=/opt/gluesync/data/security-config.json \
        -e SSL_ENABLED=false \
        -p 50000:50000 \
        $CONTAINER_MATE_IMAGE
    # Wait for container to start
    - sleep 10
    # Check if container is running
    - docker ps | grep container-mate-test
    # Check logs for startup messages
    - docker logs container-mate-test
    # Clean up
    - docker stop container-mate-test
    - docker rm container-mate-test
  only:
    - main
    - develop
    - merge_requests

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying started..."

    - apk add --no-cache bash
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - 
      | 
      MODULE_NAME=${CI_COMMIT_TAG#tag-}  # Removes everything before "tag-"
      MODULE_NAME=${MODULE_NAME%-v*}  # Removes everything after the last "-"

      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`

      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      ADDITIONAL_TAG="${DEFAULT_NAME}:${TAGPART}"

    # Set up Docker Buildx for multi-platform builds
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"
    # Install QEMU for multi-architecture builds
    - docker run --privileged --rm tonistiigi/binfmt --install all
    # Create and use a new builder instance
    - docker buildx create --name multiarch-builder --use
    - docker buildx inspect --bootstrap
    
    # Build and push multi-platform images in one command
    - |
      docker buildx build --platform linux/amd64,linux/arm64 \
        --tag $DEFAULT_NAME:latest \
        --tag "$ADDITIONAL_TAG" \
        --push .
  rules:
    - if: $CI_COMMIT_TAG