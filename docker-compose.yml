version: '3'

services:
  gluesync-conductor:
    build:
      context: .
      dockerfile: ./packages/docker-mate/Dockerfile
    image: molo17/gluesync-conductor:latest
    container_name: gluesync-conductor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - GLUESYNC_LICENSE_FILE=/opt/gluesync/data/gs-license.dat
      - GLUESYNC_SECURITY_CONFIG=/opt/gluesync/data/security-config.json
      - GLUESYNC_MODULE_TAG=gluesync-conductor
      - HOST=0.0.0.0
      - PORT=1717
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - '1717:1717'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/opt/gluesync/data
    networks:
      - gluesync-network

networks:
  gluesync-network:
    driver: bridge
