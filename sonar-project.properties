sonar.sources=.
sonar.tests=.
# Specs and the stub loader are test code, not product code
sonar.exclusions=**/*.spec.ts,packages/gluesync-conductor/src/testing/**
sonar.test.inclusions=**/*.spec.ts,packages/gluesync-conductor/src/testing/**

# Unit test coverage, produced by the quality job (yarn workspace gluesync-conductor test:coverage)
sonar.javascript.lcov.reportPaths=packages/gluesync-conductor/coverage/lcov.info
# The sandbox is a test harness, not product code
sonar.coverage.exclusions=sandbox/**
