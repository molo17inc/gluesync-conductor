stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_REGISTRY: registry.gitlab.com/molo17-public/gluesync/container-mate
  GLUESYNC_SDK_IMAGE: ${DOCKER_REGISTRY}/gluesync-sdk:${CI_COMMIT_REF_SLUG}

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    # Login to GitLab registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Build the Docker image
    - docker build -t $GLUESYNC_SDK_IMAGE -f packages/gluesync-sdk/Dockerfile .
    # Push the Docker image to GitLab registry
    - docker push $GLUESYNC_SDK_IMAGE
  only:
    - main
    - develop
    - tags

test:
  stage: test
  image: node:18-alpine
  before_script:
    - yarn install --frozen-lockfile
  script:
    - yarn workspace gluesync-sdk build
    - yarn workspace gluesync-sdk test
  only:
    - main
    - develop
    - merge_requests

deploy:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    # Login to GitLab registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Tag the image as latest if on main branch
    - |
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        docker pull $GLUESYNC_SDK_IMAGE
        docker tag $GLUESYNC_SDK_IMAGE ${DOCKER_REGISTRY}/gluesync-sdk:latest
        docker push ${DOCKER_REGISTRY}/gluesync-sdk:latest
      fi
    # Tag the image with the version tag if this is a tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker pull $GLUESYNC_SDK_IMAGE
        docker tag $GLUESYNC_SDK_IMAGE ${DOCKER_REGISTRY}/gluesync-sdk:$CI_COMMIT_TAG
        docker push ${DOCKER_REGISTRY}/gluesync-sdk:$CI_COMMIT_TAG
      fi
  only:
    - main
    - tags
