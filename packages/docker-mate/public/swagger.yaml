openapi: 3.0.0
info:
  title: Gluesync Conductor API
  description: API for managing Docker containers and agents
  version: 1.0.0
servers:
  - url: http://localhost:50000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Performs a health check on the server
      responses:
        200:
          description: Health check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: string
                    example: 'Health check OK!'

  /compose-to-json:
    get:
      summary: Convert Docker Compose file to JSON
      description: Reads a YAML Docker Compose file and converts it to JSON
      responses:
        200:
          description: Successful conversion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: JSON representation of the Docker Compose file

  /info:
    get:
      summary: Get Docker system information
      description: Returns information about the Docker system
      responses:
        200:
          description: Successfully retrieved Docker system information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Docker system information

  /version:
    get:
      summary: Get Docker version
      description: Returns version information about Docker
      responses:
        200:
          description: Successfully retrieved Docker version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Docker version information

  /containers:
    get:
      summary: List Docker containers
      description: Returns a list of all Docker containers
      responses:
        200:
          description: Successfully retrieved Docker containers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    description: List of Docker containers
                    items:
                      type: object
                      description: Docker container information

  /agents/add:
    post:
      summary: Add agents to compose file
      description: Adds one or more agents to the Docker Compose file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agents:
                  type: array
                  items:
                    type: object
                    required:
                      - imageName
                      - type
                    properties:
                      imageName:
                        type: string
                        description: Name of the Docker image
                        example: 'gluesync'
                      type:
                        type: string
                        enum: [target, source]
                        description: Type of agent
                        example: 'target'
                      nickname:
                        type: string
                        description: Nickname for the container
                        example: 'my-target-agent'
                      tag:
                        type: string
                        description: Docker image tag
                        example: 'latest'
                      environment:
                        type: object
                        description: Environment variables to set
                        example:
                          KEY1: 'value1'
                          KEY2: 'value2'
                      ports:
                        type: array
                        items:
                          type: string
                        description: Port mappings
                        example: ['8080:8080']
                      volumes:
                        type: array
                        items:
                          type: string
                        description: Volume mappings
                        example: ['./data:/data']
      responses:
        200:
          description: Successfully added agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Updated Docker Compose file

  /agents/remove:
    delete:
      summary: Remove agents from compose file
      description: Removes one or more agents from the Docker Compose file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agents:
                  type: array
                  items:
                    type: object
                    required:
                      - imageName
                      - type
                    properties:
                      imageName:
                        type: string
                        description: Name of the Docker image
                        example: 'gluesync'
                      type:
                        type: string
                        enum: [target, source]
                        description: Type of agent
                        example: 'target'
      responses:
        200:
          description: Successfully removed agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    description: Updated Docker Compose file

  /agents/start:
    post:
      summary: Start agents
      description: Starts all agents using docker-compose
      responses:
        200:
          description: Successfully started agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    description: Output from docker-compose command

  /agents/stop:
    post:
      summary: Stop agents
      description: Stops all agents using docker-compose
      responses:
        200:
          description: Successfully stopped agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                    description: Output from docker-compose command

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data
