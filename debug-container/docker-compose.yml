    image: molo17/gluesync-ibm-iseries:latest
    environment:
      - TYPE=source
      - TAG=gs-as400
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
      - INITIAL_AGENT_ID=5b985fa3
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-as400:/opt/gluesync/data
      - ./logs/gluesync-as400-logs:/opt/gluesync/logs
    labels:
      - com.molo17.conductor.type=agent
      - com.molo17.conductor.service_id=5b985fa3
  gluesync-couchbase-as400:
    restart: unless-stopped
    container_name: cb-as400
    image: molo17/gluesync-couchbase:latest
    environment:
      - TYPE=target
      - TAG=couchbase-as400
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
      - INITIAL_AGENT_ID=1300f116
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-couchbase-as400:/opt/gluesync/data
      - ./logs/gluesync-couchbase-as400-logs:/opt/gluesync/logs
    labels:
      - com.molo17.conductor.type=agent
      - com.molo17.conductor.service_id=1300f116
  gluesync-chronos:
    restart: unless-stopped
    image: molo17/gluesync-chronos:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.chronos.rule=PathPrefix(`/chronos/`) ||
        PathPrefix(`/api/`) || PathPrefix(`/chronos/api/`)
      - traefik.http.routers.chronos.entrypoints=websecure
      - traefik.http.routers.chronos.tls=true
      - traefik.http.services.chronos.loadbalancer.server.port=1717
      - traefik.http.services.chronos.loadbalancer.server.scheme=https
      - traefik.http.routers.chronos.middlewares=chronos@docker
      - traefik.http.routers.chronos.service=chronos
      - traefik.http.middlewares.chronos.replacepathregex.regex=^/chronos/api/(.*)
      - traefik.http.middlewares.chronos.replacepathregex.replacement=/api/$$1
      - traefik.http.routers.chronos.middlewares=chronos@docker
      - traefik.http.services.chronos.loadbalancer.passhostheader=true
      - com.molo17.conductor.type=module
    environment:
      - SSL_ENABLED=True
      - SSL_SKIP_VERIFY=True
      - TIMEZONE=Europe/Rome
      - LOG_LEVEL=INFO
    volumes:
      - ./shared:/opt/gluesync/shared:ro
      - ./data/chronos-data:/app/data
      - ./logs/chronos:/app/logs
