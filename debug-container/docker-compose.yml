name: debug-container
services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - 8000:8000
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --admin-password
      - $$2y$$05$$wxahdaIgY6yjxyPjvSqyr.NeLhCOY/pWLXSJykVsfUGaRXnjq3etK
  gluesync-conductor:
    build: ../packages/gluesync-conductor
    container_name: gluesync-conductor
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=trace
      - GLUESYNC_LICENSE_FILE=/opt/gluesync/data/gs-license.dat
      - GLUESYNC_SECURITY_CONFIG=/opt/gluesync/data/security-config.json
      - GLUESYNC_MODULE_TAG=gluesync-conductor
      - HOST=0.0.0.0
      - PORT=1717
      - DOCKER_HOST=unix:///var/run/docker.sock
      - BASE_PATH=$PWD
      - USE_SDK=False
      - SSL_SKIP_VERIFY=True
      - SSL_ENABLED=True
      - SSL_CERT_FILE=/opt/gluesync/data/cert.pem
      - SSL_KEY_FILE=/opt/gluesync/data/key.pem
      - SSL_SKIP_VERIFY=false
      # Test-reserved (add only for integration tests):
      # - JOB_ID=not_set
      # - TEST_NAME=DRY_RUN
      - IS_INTEGRATION_TEST=False
    ports:
      - 5017:1717
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/opt/gluesync/data
      - ./gs-conf/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ./docker-compose.yml:/opt/gluesync-conductor/docker-compose.yml
      - ./gluesync-cert.pem:/opt/gluesync/data/cert.pem
      - ./gluesync-key.pem:/opt/gluesync/data/key.pem
  gluesync-core-hub:
    image: molo17/gluesync-core-hub:2.1.4.2
    ports:
      - 1717:1717
    environment:
      - LOG_CONFIG_FILE=/opt/gluesync/data/logback.xml
    volumes:
      - ./gs-conf/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ./gs-conf/bootstrap-core-hub.json:/opt/gluesync/data/bootstrap-core-hub.json
      - ./gs-conf/security-config.json:/opt/gluesync/data/security-config.json
      - ./gs-conf/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
  gluesync-mssql-cdc-target-agent:
    image: molo17/gluesync-mssql-cdc:2.1.4.2
    container_name: custom-mssql-target
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 2.0G
        limits:
          cpus: 2
          memory: 6.4G
    labels:
      - team=data-eng
      - stage=prod
      - com.molo17.conductor.unique_id=custom-mssql-target
      - com.molo17.conductor.versiontag=2.1.4.2
      - com.molo17.conductor.type=agent
    environment:
      - type=target
      - maxRamPercentage=90
      - LOG_CONFIG_FILE=/opt/gluesync/data/logback.xml
      - GLUESYNC_MODULE_TAG=gluesync-conductor
    ports:
      - 9090:9090
      - 9090:9091
      - 8080:80
    volumes:
      - ./gs-license.dat:/opt/gluesync/data/gs-license.dat:ro
      - ./logback.xml:/opt/gluesync/data/logback.xml:ro
      - ./security-config.json:/opt/gluesync/data/security-config.json:ro
      - ./gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks:ro
      - ./bootstrap-core-hub.json:/opt/gluesync/data/bootstrap-core-hub.json:ro
      - ./gluesync-mssql-cdc-target-agent:/opt/gluesync/data
    depends_on:
      gluesync-core-hub:
        condition: service_started
  gluesync-mssql-cdc-source-agent:
    image: molo17/gluesync-mssql-cdc:2.1.4.2
    container_name: custom-mssql-source
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: 1
          memory: 2.0G
        limits:
          cpus: 2
          memory: 6.4G
    labels:
      - team=data-eng
      - stage=prod
      - com.molo17.conductor.unique_id=custom-mssql-source
      - com.molo17.conductor.versiontag=2.1.4.2
      - com.molo17.conductor.type=agent
    environment:
      - type=source
      - maxRamPercentage=90
      - LOG_CONFIG_FILE=/opt/gluesync/data/logback.xml
      - GLUESYNC_MODULE_TAG=gluesync-conductor
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=password
      - privileged=true
      - start_from=0
    ports:
      - 9090:9090
      - 9090:9091
      - 8080:80
    volumes:
      - ./gs-license.dat:/opt/gluesync/data/gs-license.dat:ro
      - ./logback.xml:/opt/gluesync/data/logback.xml:ro
      - ./security-config.json:/opt/gluesync/data/security-config.json:ro
      - ./gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks:ro
      - ./bootstrap-core-hub.json:/opt/gluesync/data/bootstrap-core-hub.json:ro
      - ./gluesync-mssql-cdc-source-agent:/opt/gluesync/data
      - ./data:/var/lib/mysql
      - ./logs:/var/log/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:1717/health || exit 1
      interval: 30s
      timeout: 10s
      retries: "5"
      start_period: 20s
