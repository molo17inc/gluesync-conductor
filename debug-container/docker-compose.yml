services:
  gluesync-core-hub:
    restart: unless-stopped
    image: molo17/gluesync-core-hub:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.corehub.entrypoints=websecure
      - traefik.http.routers.corehub.rule=PathPrefix(`/`)
      - traefik.http.routers.corehub.tls=true
      - traefik.http.services.corehub.loadbalancer.server.port=1717
      - traefik.http.services.corehub.loadbalancer.server.scheme=https
      - traefik.http.routers.corehub.service=corehub
      - traefik.http.services.corehub.loadbalancer.passhostheader=true
      - com.molo17.conductor.type=core-hub
    environment:
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
    volumes:
      - ./bootstrap-core-hub.json:/opt/gluesync/data/bootstrap-core-hub.json
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-core-hub:/opt/gluesync/data
      - ./logs/gluesync-core-hub-logs:/opt/gluesync/logs
  gluesync-conductor:
    restart: unless-stopped
    build: ../packages/gluesync-conductor
    container_name: gluesync-conductor
    labels:
      - com.molo17.conductor.type=module
    environment:
      - LOG_LEVEL=trace
      - BASE_PATH=$PWD
      - SSL_ENABLED=false
      - SSL_SKIP_VERIFY=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/opt/gluesync-conductor/docker-compose.yml
    ports:
      - 5017:1717
  gluesync-mariadb-cdc-source:
    restart: unless-stopped
    image: molo17/gluesync-mariadb-cdc:latest
    environment:
      - TYPE=source
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
      - INITIAL_AGENT_ID=cdf35604
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-mariadb-cdc-source:/opt/gluesync/data
      - ./logs/gluesync-mariadb-source-logs:/opt/gluesync/logs
    labels:
      - com.molo17.conductor.type=agent
      - com.molo17.conductor.service_id=cdf35604
  gluesync-pgsql-cdc-source:
    restart: unless-stopped
    image: molo17/gluesync-postgresql-cdc:latest
    environment:
      - TAG=minio-audit
      - TYPE=source
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
      - INITIAL_AGENT_ID=8bcf707c
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-pgsql-cdc-source:/opt/gluesync/data
      - ./logs/gluesync-pgsql-logs:/opt/gluesync/logs
    labels:
      - com.molo17.conductor.type=agent
      - com.molo17.conductor.service_id=8bcf707c
  gluesync-mssql-cdc-source:
    restart: unless-stopped
    image: molo17/gluesync-mssql-cdc:latest
    environment:
      - TAG=license-manager
      - TYPE=source
      - SSL_ENABLED=true
      - LOG_CONFIG_FILE=/opt/gluesync/shared/logback.xml
      - INITIAL_AGENT_ID=d791515d
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./shared:/opt/gluesync/shared
      - ./data/gluesync-mssql-cdc-source:/opt/gluesync/data
      - ./logs/gluesync-mssqlsource-logs:/opt/gluesync/logs
    labels:
      - com.molo17.conductor.type=agent
      - com.molo17.conductor.service_id=d791515d
  gluesync-mssql-cdc-source-replica:
    restart: unless-stopped
