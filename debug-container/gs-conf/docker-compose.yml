services:
  mssql:
    extends:
      file: ../../../commons/mssql/docker-compose.yml
      service: mssql
    ports:
      - 1433:1433
  mssqlconfigurator:
    extends:
      file: ../../../commons/mssql/docker-compose.yml
      service: mssqlconfigurator

  couchbase:
    extends:
      file: ../../../commons/couchbase/docker-compose.yml
      service: couchbase
    ports:
      - 8091:8091

  mongodb:
    extends:
      file: ../../../commons/mongodb-8.0.3/docker-compose.yml
      service: mongodb
    ports:
      - 27017:27017

  gluesync-couchbase:
    image: molo17/gluesync-couchbase:2.0.4.4
    environment:
      - type=target
    healthcheck:
      test: ["CMD-SHELL", "/scripts/agent_joined.sh"]
      interval: 30s
      timeout: 10s
      retries: 999
    volumes:
      - ../../../commons/gluesync/scripts/:/scripts
      - ../../../commons/gluesync/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ../../../commons/gluesync/security-config.json:/opt/gluesync/data/security-config.json
      - ../../../commons/gluesync/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
    #   - ./gluesync-mongodb:/opt/gluesync/data
    depends_on:
      mongodb:
        condition: service_healthy

  gluesync-mssql-ct:
    image: molo17/gluesync-mssql-ct:2.0.4.4
    environment:
      - type=source
    healthcheck:
      test: ["CMD-SHELL", "/scripts/agent_joined.sh"]
      interval: 30s
      timeout: 10s
      retries: 999
    volumes:
      - ../../../commons/gluesync/scripts/:/scripts
      - ../../../commons/gluesync/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ../../../commons/gluesync/security-config.json:/opt/gluesync/data/security-config.json
      - ../../../commons/gluesync/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
    #   - ./gluesync-mssql-ct:/opt/gluesync/data
    depends_on:
      mssql:
        condition: service_healthy

  gluesync-mongodb-target:
    image: molo17/gluesync-mongodb:2.0.4.4
    environment:
      - type=target
    healthcheck:
      test: ["CMD-SHELL", "/scripts/agent_joined.sh"]
      interval: 30s
      timeout: 10s
      retries: 999
    volumes:
      - ../../../commons/gluesync/scripts/:/scripts
      - ../../../commons/gluesync/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ../../../commons/gluesync/security-config.json:/opt/gluesync/data/security-config.json
      - ../../../commons/gluesync/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
    #   - ./gluesync-mongodb:/opt/gluesync/data

  gluesync-mongodb-source:
    image: molo17/gluesync-mongodb:2.0.4.4
    environment:
      - type=source
    healthcheck:
      test: ["CMD-SHELL", "/scripts/agent_joined.sh"]
      interval: 30s
      timeout: 10s
      retries: 999
    volumes:
      - ../../../commons/gluesync/scripts/:/scripts
      - ../../../commons/gluesync/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ../../../commons/gluesync/security-config.json:/opt/gluesync/data/security-config.json
      - ../../../commons/gluesync/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
    #   - ./gluesync-mongodb:/opt/gluesync/data

  # Official product documentation available at: https://molo17.com/docs/gluesync/
  gluesync-core-hub:
    image: molo17/gluesync-core-hub:2.0.4.4
    ports:
      - 1717:1717
    healthcheck:
      test: ["CMD-SHELL", "/scripts/pipeline_idle.sh"]
      interval: 15s
      timeout: 10s
      retries: 999
    volumes:
      - ../../../commons/gluesync/scripts/:/scripts
      - ../../../commons/gluesync/gs-license.dat:/opt/gluesync/data/gs-license.dat
      - ../../../commons/gluesync/security-config.json:/opt/gluesync/data/security-config.json
      - ../../../commons/gluesync/gluesync.com.jks:/opt/gluesync/data/gluesync.com.jks
      - ../../../commons/gluesync/bootstrap-core-hub.json:/opt/gluesync/data/bootstrap-core-hub.json
    #   - ./gluesync-core-hub-data:/opt/gluesync/data

